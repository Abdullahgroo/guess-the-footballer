<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Football Guess Game</title>
  <style>
    body { font-family: Arial; text-align: center; padding: 20px; }
    button { padding: 10px; margin: 5px; cursor: pointer; }
    #hints { margin-top: 20px; }
  </style>
</head>
<body>
  <h1>⚽ Guess the Football Player ⚽</h1>
  <label>Choose a number (0 - 37):</label>
  <input type="number" id="choice" min="0" max="37">
  <button onclick="startGame()">Start</button>

  <div id="game" style="display:none;">
    <div id="hints"></div>
    <button onclick="getHint()">Get Hint</button>
    <br><br>
    <input type="text" id="guess" placeholder="Enter player name">
    <button onclick="checkAnswer()">ENTER</button>
    <p id="result"></p>
  </div>

  <script>
    let choice, hintNo = 0;

    function startGame() {
      choice = document.getElementById("choice").value;
      document.getElementById("game").style.display = "block";
      document.getElementById("hints").innerHTML = "";
      document.getElementById("result").innerText = "";
      hintNo = 0;
    }

    function getHint() {
      fetch("/get_hint", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ index: choice, hint_no: hintNo })
      })
      .then(res => res.json())
      .then(data => {
        document.getElementById("hints").innerHTML += "<p>" + data.hint + "</p>";
        hintNo++;
      });
    }

    function checkAnswer() {
      let guess = document.getElementById("guess").value;
      fetch("/check_answer", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ index: choice, guess: guess })
      })
      .then(res => res.json())
      .then(data => {
        document.getElementById("result").innerText = data.result;
      });
      headers
    }
  </script>
</body>
</html>
